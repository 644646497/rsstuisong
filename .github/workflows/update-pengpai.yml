name: Update Pengpai RSS

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动更新一次
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      
      - name: Run Pengpai RSS script
        run: |
          cd pengpai
          python pp.py
      
      - name: Commit and push changes
        run: |
          git config --global user.name "644646497"
          git config --global user.email "w2700681@gmail.com"
          git add pengpai/pengpai.xml
          git commit -m "自动更新澎湃新闻RSS" || echo "没有新内容需要更新"
          git push
